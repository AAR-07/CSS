<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестирование Позиционирования</title>
    <style>
        body {
            margin: 0px;
            background-color: gray;
        }

        .block {
            margin: 10px 0px 0px 10px;
            position: relative;
            width: 300px;
            height: 400px;
            background-color: gray;
        }

        .class1 {
            background-color: red;
            width: 200px;
            height: 100px;
            position: relative;
            top: 20px;
            left: 20px;
        }

        .class2 {
            background-color: green;
            width: 200px;
            height: 100px;
            position: relative;
            top: 40px;
            left: 20px;
        }

        .class3 {
            background-color: blue;
            width: 200px;
            height: 100px;
            position: relative;
            top: 00px;
            left: 00px;
        }

        .class4 {
            border: dashed 2px white;
            width: 196px;
            height: 96px;
            position: absolute;
            top: 0px;
            color: white;
        }

        .class5 {
            /* box-shadow: inset 0 0 0 2px #000; */
            border: 2px dashed #ffffff;
            width: 196px;
            height: 96px;
            position: absolute;
            top: 100px;
            color: white;
        }
    </style>
</head>

<body>
    <div class="block">
        <div class="class1"></div>
        <div class="class2"></div>
        <div class="class3"></div>
        <div class="class4">1</div>
        <div class="class5">2</div>
    </div>
</body>

</html>
