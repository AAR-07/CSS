<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прямоугольник и круг</title>
    <style>
        body {
            background-color: gray
        }

        .txt {
            position: absolute;
            color: rgb(255, 255, 255);
            font-size: 18px;
            font-family: monospace;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            bottom: -15%;
            left: 50%;
            transform: translateX(-50%);
        }

        .square_fill {
            width: 250px;
            height: 300px;
            background-color: bisque;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .orbL {
            width: 30px;
            height: 30px;
            border: solid 5px #724715;
            position: absolute;
            left: 15%;
            top: 50px;
        }

        .orbR {
            width: 30px;
            height: 30px;
            border: solid 5px #724715;
            position: absolute;
            right: 15%;
            top: 50px;
        }

        .nose {
            border-left: 5px solid #724715;
            height: 70px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .mouth {
            border-bottom: 5px solid #724715;
            width: 120px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, 90px);
        }

        .square_fill:hover {
            p {
                visibility: hidden;
            }

            border-radius: 10%;
            background-image: linear-gradient(-45deg, #2E9AFF, #F498AD);
            box-shadow: 0px 0px 100px rgb(255, 255, 255);

            .mouth {
                border-bottom: 5px solid #ffffff;
                border-left: 5px solid #ffffff;
                border-radius: 0% 0% 0% 90%;
                width: 120px;
                height: 120px;
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, 0px) rotate(-45deg);
            }

            .nose {
                border-left: 5px solid #ffffff;
                height: 70px;
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
            }

            .orbL {
                width: 40px;
                height: 40px;
                border-top: solid 0px #ffffff;
                border-right: solid 0px #ffffff;
                border-bottom: solid 5px #ffffff;
                border-left: solid 5px #ffffff;
                border-radius: 0% 0% 0% 90%;
                position: absolute;
                transform: rotate(-45deg);
                left: 15%;
                top: 50px;
            }

            .orbR {
                width: 50px;
                height: 50px;
                right: 10%;
                top: 40px;
                border: solid 5px #ffffff;
                border-radius: 50%;
                position: absolute;
                transform: rotate(-45deg);
            }
        }
    </style>
</head>

<body>
    <div class="square_fill">
        <div class="orbL"></div>
        <div class="orbR"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
        <div class="mouth2"></div>
        <p class="txt">hover me</p>
    </div>

</body>

</html>
